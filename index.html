<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ДР Кати">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>День рождения Кати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* App shell in VOLYO's language: top bar, screens, floating bottom menu with a round "+"; deep black with gold accent */
:root{
  --bg:#050505; --fg:#F2EDE2; --muted:rgba(242,232,218,.58); --dim:rgba(242,232,218,.36);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --glass:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),rgba(0,0,0,.28);
  --hl:inset 0 1px 0 rgba(255,255,255,.06);
  --amber:#C9A227; --glow:#E8C766; --sage:#a9bb8c; --danger:#e07a6a;
  --warm-line:rgba(212,175,55,.38);
  --font:Manrope,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;text-wrap:pretty;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(120px + env(safe-area-inset-bottom,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
body::after{content:"";position:fixed;z-index:-1;left:50%;top:-180px;width:min(760px,150vw);height:520px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side at 50% 30%,rgba(232,199,102,.30),rgba(201,162,39,.10) 45%,rgba(5,5,5,0) 75%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:8px}
.app{max-width:600px;margin:0 auto}
@media (min-width:960px){.app{max-width:960px}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;
  padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,rgba(5,5,5,0))}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.09);box-shadow:var(--hl);text-decoration:none;color:var(--fg);font-weight:600;font-size:15px}
.circ.av{border-color:var(--warm-line);box-shadow:var(--hl),0 0 16px -6px rgba(212,175,55,.6);color:var(--glow)}
.brand{font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{justify-self:end;font-size:12.5px;color:var(--muted);padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.days b{color:var(--glow);font-weight:600}

.notice{border:1px solid var(--warm-line);background:rgba(201,162,39,.07);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--glow);margin:4px 0 12px}

/* screen headings */
.hello{padding:14px 0 6px}
.hello p{margin:0;color:var(--muted);font-size:13.5px}
.hello h2{margin:6px 0 0;font-size:28px;line-height:1.22;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hello h2 em{font-style:normal;color:var(--glow)}
.ptitle{padding:10px 0 4px}
.ptitle textarea{resize:none;overflow:hidden;display:block;font:inherit;color:inherit}
.ptitle textarea,.ptitle h2{width:100%;margin:0;background:none;border:1px solid transparent;border-radius:10px;outline:none;padding:2px 6px;margin-left:-6px;font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.ptitle textarea:hover{border-color:var(--line)}
.ptitle textarea:focus{border-color:var(--line-2);background:rgba(255,255,255,.03)}
.ptitle p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;font-size:16px;font-weight:600}
.sec-h a,.sec-h span{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none}
.sec-h a:hover{color:var(--glow)}

/* glass surfaces */
.card{background:var(--glass);border:1px solid rgba(255,255,255,.07);box-shadow:var(--hl),0 14px 34px -18px rgba(0,0,0,.6);border-radius:20px}
a.card{display:block;text-decoration:none;color:var(--fg);transition:border-color .2s,box-shadow .2s}
a.card:hover{border-color:rgba(232,199,102,.26);box-shadow:var(--hl),0 18px 40px -22px rgba(212,175,55,.35)}

/* stat tiles */
.stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
@media (min-width:960px){.stiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stile{padding:16px 16px 14px;border-radius:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stile svg.i{color:var(--glow);width:24px;height:24px}
.stile b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stile small{font-size:12.5px;color:var(--muted);line-height:1.35}
.bar{height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--glow))}

/* section cards on home */
.slist{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:960px){.slist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{padding:18px 18px 16px;display:flex!important;flex-direction:column;gap:10px;min-width:0}
.scard-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.scard h3{margin:0;font-size:16px;font-weight:600;line-height:1.3;min-width:0}
.scard-h svg.i{color:var(--dim);width:18px;height:18px}
.scard .meta{font-size:12.5px;color:var(--muted)}
.scard .meta b{color:var(--fg);font-weight:600}
.prev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.prev li{display:flex;gap:9px;align-items:baseline;min-width:0}
.prev li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prev .tm{color:var(--glow);font-variant-numeric:tabular-nums;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none;transform:translateY(-2px)}
.dot.s1{background:var(--amber)}.dot.s2{background:var(--sage)}

/* people */
.prow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:960px){.prow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{padding:16px;display:flex!important;align-items:center;gap:12px;min-width:0}
.pcard .circ{flex:none;width:38px;height:38px;font-size:14px}
.pcard div{min-width:0}
.pcard b{display:block;font-size:15px;font-weight:600}
.pcard div span{display:block;font-size:12.5px;color:var(--muted)}
.pcard b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.09);color:var(--fg);border-color:var(--warm-line);box-shadow:var(--hl)}

/* items */
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 2px;font-size:13.5px;color:var(--muted)}
.grp-h a{font-size:13px;text-decoration:none;color:var(--dim)}
.grp-h a:hover{color:var(--glow)}
.item{display:grid;align-items:center;gap:8px 10px;padding:12px 12px 12px 14px;border-radius:16px;min-height:58px;
  background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);box-shadow:var(--hl)}
.item.shop{grid-template-columns:26px minmax(0,1fr) 64px 104px auto 28px}
.item.ideas,.item.tasks{grid-template-columns:26px minmax(0,1fr) auto 28px}
.item.plan{grid-template-columns:minmax(0,1fr) 78px auto 28px}
.item .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.item textarea,.item input[type=text],.item input[type=number],.item input[type=time]{width:100%;background:none;border:1px solid transparent;border-radius:8px;outline:none;padding:3px 6px;margin:-3px -6px;resize:none;overflow:hidden;line-height:1.45}
.item textarea:hover,.item input:hover{border-color:var(--line)}
.item textarea:focus,.item input:focus{border-color:var(--line-2);background:rgba(255,255,255,.03)}
.item .t{font-size:15px;font-weight:500}
.item .n{font-size:12.5px;color:var(--muted)}
.item .n::placeholder{color:var(--dim)}
.item input[type=number]{text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;font-size:13.5px;color:var(--muted)}
.item input[type=number]::-webkit-inner-spin-button{display:none}
.item input[type=time]{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);text-align:right;color-scheme:dark}
.ctl{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;min-width:0}
.pill{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 10px 5px 12px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;max-width:100%}
.pill::after{content:"";width:5px;height:5px;border:1.5px solid currentColor;border-top:0;border-left:0;transform:rotate(45deg) translateY(-2px);opacity:.6}
.pill:hover{border-color:rgba(255,255,255,.18);color:var(--fg)}
.pill.set{color:var(--fg)}
.pill[data-s="1"]{color:var(--glow);border-color:rgba(232,199,102,.26)}
.pill[data-s="2"]{color:var(--sage);border-color:rgba(169,187,140,.3)}
.pill[data-s="3"]{color:var(--dim)}
.menu{position:fixed;z-index:70;min-width:170px;max-width:240px;padding:6px;border-radius:16px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),#101010;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 44px rgba(0,0,0,.7),var(--hl)}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:14px}
.menu button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.menu button[aria-selected="true"]{color:var(--fg)}
.menu button[aria-selected="true"]::after{content:"";width:9px;height:4px;border:1.8px solid var(--glow);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-2px)}

/* hero photo */
.hero{position:relative;margin-top:6px;height:310px;border-radius:24px;overflow:hidden;background:radial-gradient(closest-side at 50% 20%,rgba(232,199,102,.25),rgba(5,5,5,0)),#0b0906;border:1px solid rgba(232,199,102,.14);box-shadow:0 22px 50px -26px rgba(212,175,55,.4)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,0) 50%,rgba(5,5,5,.88))}
.hero p{position:absolute;z-index:1;left:18px;right:18px;bottom:14px;margin:0;font-size:13.5px;color:rgba(242,237,226,.82)}
@media (min-width:960px){.hero{height:400px}.hero img{object-position:50% 55%}}

/* section tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:959px){.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;min-height:0}}
@media (min-width:960px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{padding:16px;min-height:120px;display:flex!important;flex-direction:column;justify-content:space-between;gap:16px;min-width:0}
.tile svg.i{color:var(--glow)}
.tile b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.tile small{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-padding:0 16px}
.board::-webkit-scrollbar{display:none}
@media (min-width:700px){.board{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;overflow:visible}}
.col{scroll-snap-align:start;padding:10px;border-radius:20px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0}
.col.over{border-color:var(--warm-line);background:rgba(201,162,39,.05)}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 2px;font-size:13.5px;font-weight:600}
.col-h span{color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
.col-h i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:9px;transform:translateY(-1px)}
.col[data-s="1"] .col-h i{background:var(--amber);box-shadow:0 0 8px rgba(201,162,39,.7)}
.col[data-s="2"] .col-h i{background:var(--sage)}
.kc{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 12px 12px 14px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.07);box-shadow:var(--hl);font-size:14px;line-height:1.4;color:var(--fg)}
.kc span{flex:1;min-width:0}
.kc em{flex:none;font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid var(--warm-line);color:var(--glow)}
.kc:hover{border-color:rgba(232,199,102,.26)}
.col[data-s="2"] .kc span{color:var(--muted)}
.kc.drag{opacity:.35}
.col .empty{padding:8px 6px}
.addc{width:32px;height:32px;border-radius:50%;border:1px solid var(--warm-line);background:rgba(255,255,255,.05);color:var(--glow);display:grid;place-items:center;padding:0}
.addc svg.i{width:18px;height:18px}
.sheet textarea{width:100%;margin-top:4px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;outline:none;resize:none;overflow:hidden;line-height:1.45}
.sheet textarea:focus{border-color:rgba(232,199,102,.4)}
.sheet textarea.t{font-size:16px;font-weight:600}
.sheet textarea.n{font-size:14px;color:var(--muted);margin-top:8px}
.sheet .lbl{margin:14px 0 -4px;font-size:12.5px;color:var(--dim)}
.chk,.st{width:22px;height:22px;margin:1px 0 0;align-self:start;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:none;padding:0;display:grid;place-items:center}
.chk[aria-checked="true"],.st[data-s="2"]{background:rgba(169,187,140,.14);border-color:var(--sage)}
.chk[aria-checked="true"]::after,.st[data-s="2"]::after{content:"";width:8px;height:4px;border:1.8px solid var(--sage);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.st[data-s="1"]{border-color:var(--amber);box-shadow:0 0 10px -2px rgba(201,162,39,.6)}
.st[data-s="1"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.st[data-s="3"]{border-style:dashed;border-color:rgba(255,255,255,.18)}
.chk:hover,.st:hover{border-color:rgba(255,255,255,.5)}
.stw{font-size:12.5px;color:var(--dim);text-align:right;white-space:nowrap}
.stw[data-s="1"]{color:var(--amber)}.stw[data-s="2"]{color:var(--sage)}
.item.s3 .t,.item.done .t{color:var(--dim)}
.q,.p{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.q span,.p span{font-size:12.5px;color:var(--dim);flex:none}
.x{width:28px;height:28px;border:0;background:none;color:var(--dim);border-radius:50%;font-size:17px;line-height:1;justify-self:end;align-self:start;margin-top:-2px}
.x:hover{color:var(--danger);background:rgba(224,122,106,.12)}
.x.arm{color:var(--bg);background:var(--danger)}
@media (max-width:699px){
  .item.shop{grid-template-columns:26px auto auto minmax(0,1fr) 28px;row-gap:10px}
  .item.shop .chk{grid-row:1;grid-column:1}
  .item.shop .main{grid-row:1;grid-column:2/5}
  .item.shop .x{grid-row:1;grid-column:5}
  .item.shop .q{grid-row:2;grid-column:2;justify-content:flex-start}
  .item.shop .p{grid-row:2;grid-column:3;justify-content:flex-start}
  .item.shop .q input{text-align:left;width:44px;flex:none}
  .item.shop .p input{text-align:left;width:80px;flex:none}
  .item.shop .ctl{grid-row:2;grid-column:4;justify-content:flex-end!important}
  .item.ideas,.item.tasks{grid-template-columns:26px minmax(0,1fr) 28px}
  .item.ideas .st,.item.tasks .st{grid-row:1;grid-column:1}
  .item.ideas .main,.item.tasks .main{grid-row:1;grid-column:2}
  .item.ideas .x,.item.tasks .x{grid-row:1;grid-column:3}
  .item.ideas .ctl,.item.tasks .ctl{grid-row:2;grid-column:2}
  .item.plan{grid-template-columns:minmax(0,1fr) 28px}
  .item.plan .main{grid-row:1;grid-column:1}
  .item.plan .x{grid-row:1;grid-column:2}
  .item.plan .tm{grid-row:2;grid-column:1;text-align:left;width:96px}
  .item.plan .ctl{grid-row:3;grid-column:1}
  .item .ctl{justify-content:flex-start}
}
.empty{color:var(--dim);font-size:13.5px;padding:14px 2px}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 14px;outline:none}
.add input:focus{border-color:rgba(232,199,102,.4)}
.add button{flex:none;width:46px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);display:grid;place-items:center}
.add button:hover{border-color:var(--warm-line)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
.pfoot b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--dim);font-size:13px;padding:4px 0}
.linkbtn:hover,.linkbtn.arm{color:var(--danger)}

/* team screen */
.form{padding:6px 18px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow span{flex:none;width:96px;color:var(--muted);font-size:13.5px}
.frow input{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:10px;padding:6px 8px;outline:none}
.frow input:hover{border-color:var(--line)}
.frow input:focus{border-color:var(--line-2);background:rgba(255,255,255,.03)}
.newsec{padding:18px;display:flex;flex-direction:column;gap:10px}
.newsec input,.newsec select{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 14px;outline:none}

<script>
(() => {
const S = { sections: new Map(), items: new Map(), meta: {}, got: {s:false,i:false,m:false}, who: "all" };
const drafts = new Map();
const timers = new Map();
let api = null;
const STATUS = ["идея","берём","готово","мимо"];
const TSTATUS = ["сделать","в работе","готово"];
const stList = kind => kind === "tasks" ? TSTATUS : STATUS;
const KINDNAME = { shop:"Покупки", ideas:"Идеи", plan:"План по времени", tasks:"Задачи", notes:"Банк идей" };
const DEFAULT_META = { title:"День рождения Кати", date:"29 декабря", place:"Загородный дом", guests:"", currency:"₽", team:"Вика, Люба, Данил" };

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const meta = k => (S.meta[k] ?? DEFAULT_META[k] ?? "");
const team = () => String(meta("team")).split(/[,;]+/).map(s => s.trim()).filter(Boolean);
const fmt = n => n.toLocaleString("ru-RU", { maximumFractionDigits: 0 });
const val = (col, id, f, stored) => { const k = col+"|"+id+"|"+f; return drafts.has(k) ? drafts.get(k) : (stored ?? ""); };
const ICON = {
  home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  bag:'<path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  people:'<circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><path d="M15.5 6.2a3 3 0 0 1 0 5.6M17.5 14.8c1.4.6 2.4 1.9 3 4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wallet:'<rect x="3.5" y="6.5" width="17" height="12" rx="2.5"/><path d="M16 12.5h2"/>',
  spark:'<path d="M12 4l1.8 4.6L18.5 10l-4.7 1.6L12 16l-1.8-4.4L5.5 10l4.7-1.4z"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/>',
  back:'<path d="M14.5 6l-6 6 6 6"/>',
  chev:'<path d="M9.5 6l6 6-6 6"/>',
  tree:'<path d="M12 3l5 7h-3l4 6h-5v4h-2v-4H6l4-6H7z"/>',
  dice:'<rect x="4.5" y="4.5" width="15" height="15" rx="3.5"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/>',
  gift:'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3.5 9h17M12 9v11M12 9c-1.5-3-5-3.5-5-1.2S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.2S14 9 12 9z"/>',
  arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  chain:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  out:'<path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>',
  photo:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="M20.5 15.5l-5-4.5-8.5 7.5"/>',
  compose:'<path d="M12 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V12"/><path d="M17.5 3.5l3 3-8 8H9.5v-3z"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  crown:'<path d="M4 8l4 4 4-6 4 6 4-4-1.5 10h-13z"/>',
  user:'<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/>',
  grid:'<rect x="4.5" y="4.5" width="6" height="6" rx="1.8"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.8"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.8"/><rect x="13.5" y="13.5" width="6" height="6" rx="1.8"/>',
  list:'<path d="M9 7h11M9 12h11M9 17h11"/><circle cx="5" cy="7" r=".9" fill="currentColor"/><circle cx="5" cy="12" r=".9" fill="currentColor"/><circle cx="5" cy="17" r=".9" fill="currentColor"/>',
};
const secIcon = s => s.kind === "shop" ? "bag" : s.kind === "plan" ? "clock" : s.kind === "tasks" ? "list"
  : /декор|ёлк|елк/i.test(s.title || "") ? "tree" : /игр|задан|квест/i.test(s.title || "") ? "dice" : /фишк|сюрприз|подар/i.test(s.title || "") ? "gift" : "spark";
const ic = (n, cls) => `<svg class="i ${cls || ""}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- access key: from the link, remembered on this device for the home-screen app ---------- */
let KEYM = (location.hash.match(/k=([a-z0-9]{20,64})/) || [])[1] || "";
try {
  if (KEYM) localStorage.setItem("katya-key", KEYM);
  else { const saved = localStorage.getItem("katya-key"); if (saved) { KEYM = saved; history.replaceState(null, "", "#k=" + saved); } }
} catch (e) {}

/* ---------- storage: shared Supabase document ---------- */
const CFG = { url: "https://amcbxjwgiqphqikzcxfj.supabase.co", key: "sb_publishable_pDMx4w2cbHbuf7Y6cHiE2g_mFT8hlPB" };
const LKEY = "katya-board-" + KEYM;
const now = () => Date.now();
let D = { sections:{}, items:{}, meta:{}, del:{} };
try { const c = JSON.parse(localStorage.getItem(LKEY) || "null"); if (c && c.items) D = c; } catch (e) {}
const saveLocal = () => { try { localStorage.setItem(LKEY, JSON.stringify(D)); } catch (e) {} };
function applyToS() {
  S.sections = new Map(Object.entries(D.sections)); S.items = new Map(Object.entries(D.items));
  S.meta = D.meta || {}; S.got = { s:true, i:true, m:true }; render();
}
function merge(a, b) {
  if (!b || typeof b !== "object") return a;
  const out = { sections:{}, items:{}, meta:{}, del:{ ...(a.del || {}) } };
  for (const [k, t] of Object.entries(b.del || {})) out.del[k] = Math.max(out.del[k] || 0, t);
  for (const col of ["sections", "items"]) {
    const A = a[col] || {}, B = b[col] || {};
    for (const id of new Set([...Object.keys(A), ...Object.keys(B)])) {
      const x = A[id], y = B[id];
      const w = !x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x);
      if (out.del[id] && out.del[id] >= (w.u || 0)) continue;
      out[col][id] = w;
    }
  }
  out.meta = ((b.meta || {}).u || 0) > ((a.meta || {}).u || 0) ? b.meta : (a.meta || {});
  return out;
}
async function rpc(fn, body) {
  const r = await fetch(CFG.url + "/rest/v1/rpc/" + fn, { method:"POST",
    headers:{ "Content-Type":"application/json", apikey:CFG.key, Authorization:"Bearer " + CFG.key }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
let pushTimer = null, busy = false, dirty = false, lastSync = "";
function status(ok) {
  if (ok) { lastSync = new Date().toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" }); note(""); const el = $("#sync"); if (el) el.textContent = "Сохранено для всех в " + lastSync; }
  else note("Нет связи, правки сохранены на этом устройстве и уйдут, когда появится интернет");
}
function schedulePush() { dirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; sync(); }, 700); }
async function sync() {
  if (busy) { dirty = true; return; }
  busy = true; const hadLocal = dirty; dirty = false;
  try {
    const rem = await rpc("el_get", { k: KEYM });
    const before = JSON.stringify(D);
    D = merge(D, rem);
    if (hadLocal || !rem || JSON.stringify(rem) !== JSON.stringify(D)) await rpc("el_put", { p_k: KEYM, p_d: D });
    saveLocal(); if (JSON.stringify(D) !== before) applyToS();
    status(true);
  } catch (e) { dirty = dirty || hadLocal; status(false); }
  busy = false;
  if (dirty) { clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; sync(); }, 1500); }
}
function touched() { saveLocal(); applyToS(); schedulePush(); }
const syncApi = {
  set(c, id, d) { if (c === "meta") D.meta = { ...d, u: now() }; else D[c][id] = { ...d, u: now() }; touched(); },
  update(c, id, p) {
    if (c === "meta") D.meta = { ...DEFAULT_META, ...D.meta, ...p, u: now() };
    else if (D[c][id]) D[c][id] = { ...D[c][id], ...p, u: now() };
    touched();
  },
  del(c, id) { delete D[c][id]; D.del[id] = now(); touched(); },
};
/* ---------- photo: kept in the shared store behind the key, never in the public repo ---------- */
let photo = "";
async function loadPhoto() {
  const PK = "katya-photo-" + KEYM;
  let du = ""; try { du = localStorage.getItem(PK) || ""; } catch (e) {}
  const show = async d => { try { photo = URL.createObjectURL(await (await fetch(d)).blob()); $("#ibg").style.backgroundImage = `url(${photo})`; render(); } catch (e) {} };
  if (du) show(du);
  try {
    const r = await rpc("el_get", { k: KEYM + "ph" });
    if (r && r.img && r.img !== du) { try { localStorage.setItem(PK, r.img); } catch (e) {} show(r.img); }
  } catch (e) {}
}
function note(t) { $("#notice").innerHTML = t ? '<div class="notice">' + esc(t) + "</div>" : ""; }
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }
const newId = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- routing ---------- */
const route = () => { const m = location.hash.match(/[#&]p=([^&]*)/); return m ? decodeURIComponent(m[1]) : ""; };
const href = p => "#k=" + KEYM + (p ? "&p=" + encodeURIComponent(p) : "");
const secs = () => [...S.sections.entries()].sort((x, y) => (x[1].ord || 0) - (y[1].ord || 0));
const firstOf = kind => (secs().find(([, s]) => s.kind === kind) || [])[0] || "";
const curWho = () => { const r = route(); return r.startsWith("who:") ? r.slice(4) : S.who; };
const matchWho = (it, w) => w === "all" || (w === "none" ? !it.who : it.who === w || it.who === "Все");
const secItems = sid => [...S.items.entries()].filter(([, it]) => it.sec === sid).sort((a, b) => (a[1].ord || 0) - (b[1].ord || 0));
const isOpen = (kind, it) => kind === "shop" ? !it.done : kind === "plan" ? true : ((it.st | 0) < 2);
const taskSec = () => firstOf("tasks");
const label = s => s.title || KINDNAME[s.kind] || "Раздел";
const personName = w => w === "none" ? "Ничьё" : w;
function daysLeft() {
  const n = new Date(); const t = new Date(2026, 11, 29);
  return Math.ceil((t - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
}
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k > 1 && k < 5 ? b : k === 1 ? a : c; };

/* ---------- render pieces ---------- */
const HUBS = [
  { id:"tasks", t:"Задачи", i:"list" }, { id:"shop", t:"Покупки", i:"bag" },
  { id:"ideas", t:"Банк идей", i:"spark" }, { id:"fun", t:"Развлечения", i:"dice" } ];
const hubName = h => (HUBS.find(x => x.id === h) || {}).t || "";
const hubOf = s => s.kind === "concept" ? "concept" : s.kind === "tasks" ? "tasks" : s.kind === "shop" ? "shop" : s.kind === "notes" ? "ideas"
  : (s.hub === "fun" || s.hub === "ideas") ? s.hub
  : s.kind === "plan" || /игр|задан|квест|развлеч|конкурс/i.test(s.title || "") ? "fun" : "ideas";
const hubSecs = h => secs().filter(([, s]) => hubOf(s) === h);
const realSecs = () => secs().filter(([, s]) => s.kind !== "concept");
const okHubs = kind => kind === "shop" ? ["shop"] : kind === "tasks" ? ["tasks"] : kind === "notes" ? ["ideas"] : ["ideas", "fun"];
S.tab = {}; S.f = "all";
function curSec(h) { const list = hubSecs(h); const t = S.tab[h]; return list.some(([id]) => id === t) ? t : (list[0] || [])[0] || ""; }

function renderTop(home) {
  const left = home
    ? `<span></span>`
    : `<a class="circ" href="${href(route().startsWith("who:") ? "team" : "")}" aria-label="Назад">${ic("back")}</a>`;
  $("#top").innerHTML = `${left}<a class="bpill" href="${href("")}"><i>${ic("gift")}</i><span><b>${esc(meta("title"))}</b><small>${esc(meta("date"))}</small></span></a>
    <a class="circ" href="${href("team")}" aria-label="Команда и настройки">${ic("grid")}</a>`;
}
function renderNav(r) {
  const on = x => x === "home" ? !r : r === "concept";
  const tab = (p, k, i, t) => `<a href="${href(p)}" class="${on(k) ? "on" : ""}" ${on(k) ? 'aria-current="page"' : ""}>${ic(i)}<span>${t}</span></a>`;
  $("#nav").innerHTML = tab("", "home", "home", "Главная")
    + `<button class="plus" data-act="sheet" aria-label="Добавить">${ic("plus")}</button>`
    + tab("concept", "concept", "crown", "Концепция");
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
let colAdd = null;
function board(sid) {
  const rows = secItems(sid);
  return `<div class="board" data-sec="${esc(sid)}">${TSTATUS.map((t, s) => {
    const cards = rows.filter(([, it]) => Math.min(it.st | 0, 2) === s);
    const adding = colAdd && colAdd.sid === sid && colAdd.s === s;
    return `<div class="col" data-s="${s}"><div class="col-h"><b><i></i>${t[0].toUpperCase() + t.slice(1)}<span>${cards.length}</span></b></div>
      ${cards.map(([id, it]) => `<div class="kc" role="button" tabindex="0" data-act="task" data-tid="${esc(id)}">
        <div class="kt">${esc(it.text) || "Без названия"}</div>${it.note ? `<div class="kn">${esc(it.note)}</div>` : ""}
        <div class="km">${it.who ? `<span class="kw">${ic("user")}${esc(it.who)}</span>` : `<span class="kw none">${ic("user")}нет ответственного</span>`}${it.due ? `<span class="kd">${ic("cal")}${esc(it.due)}</span>` : ""}</div></div>`).join("")}
      ${adding ? `<div class="cform"><input type="text" data-add="${esc(sid)}" data-st="${s}" placeholder="Что нужно сделать?" aria-label="Новая задача" autocomplete="off">
          <div><button class="btn" data-act="coladd-ok">Добавить</button><button class="ghost" data-act="coladd-x">Отмена</button></div></div>`
        : `<button class="cnew" data-act="coladd" data-s="${s}" data-sec="${esc(sid)}">${ic("plus")}Добавить задачу</button>`}</div>`;
  }).join("")}</div>`;
}

/* drag cards: mouse moves at once, finger after a short hold */
let drag = null, eatClick = false, pendingRender = false;
function dragStart() {

  const t = target(el); if (!t) return;
  if (el.tagName === "TEXTAREA") autosize(el);
  const k = t.col + "|" + t.id + "|" + el.dataset.f;
  drafts.set(k, el.value);
  clearTimeout(timers.get(k));
  timers.set(k, setTimeout(() => flush(t.col, t.id, el.dataset.f), 600));
});
document.addEventListener("focusout", e => {
  const el = e.target; if (!el.dataset || !el.dataset.f || el.tagName === "SELECT") return;
  const t = target(el); if (!t) return;
  flush(t.col, t.id, el.dataset.f);
  const k = t.col + "|" + t.id + "|" + el.dataset.f;
  setTimeout(() => drafts.delete(k), 1500);
});
function addTo(sid, text, st) {
  const kind = S.sections.get(sid)?.kind; if (!kind || !text) return false;
  const w = curWho();
  const d = { sec: sid, text, note: "", who: w !== "all" && w !== "none" ? w : "", ord: Date.now() };
  if (kind === "shop") Object.assign(d, { qty: "", price: "", done: false });
  else if (kind === "plan") d.time = "";
  else if (kind === "notes") Object.assign(d, { body: "", imgs: [] });
  else d.st = st | 0;
  api.set("items", newId("i"), d);
  return true;
}
function addItem(sid, input) {
  const text = input.value.trim(); if (!text) { input.focus(); return; }
  input.value = ""; addTo(sid, text, +(input.dataset.st || 0));
}
const armed = new WeakSet();
function confirmClick(btn, lbl, fn) {
  if (armed.has(btn)) { fn(); return; }
  armed.add(btn); btn.classList.add("arm"); const old = btn.textContent; btn.textContent = lbl;
  setTimeout(() => { armed.delete(btn); btn.classList.remove("arm"); btn.textContent = old; }, 2600);
}

/* ---------- in-page pickers (instead of system dropdowns) ---------- */
let nsKind = "ideas";
let menuCtx = null;
const menu = $("#menu");
function closeMenu() { menu.hidden = true; menuCtx = null; }
function openMenu(btn) {
  const t = target(btn); if (!t) return;
  const f = btn.dataset.menu; let opts, cur;
  if (f === "hub") {
    const s = S.sections.get(t.id); if (!s) return;
    opts = okHubs(s.kind).map(h => [h, hubName(h)]); cur = hubOf(s);
  } else {
    const it = S.items.get(t.id); if (!it) return; const kind = S.sections.get(it.sec)?.kind;
    opts = f === "who" ? [...team().map(p => [p, p]), ["Все", "Все"], ["", "Никто"]] : stList(kind).map((l, i) => [String(i), l]);
    cur = f === "who" ? (it.who || "") : String(it.st | 0);
  }
  menu.innerHTML = opts.map(([v, l]) => `<button role="option" data-act="pick" data-v="${esc(v)}" aria-selected="${v === cur}">${esc(l)}</button>`).join("");
  menuCtx = { col: t.col, id: t.id, f };
  menu.hidden = false;
  const r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  const left = Math.max(10, Math.min(r.right - mw, innerWidth - mw - 10));
  const top = r.bottom + 6 + mh > innerHeight - 90 ? Math.max(10, r.top - 6 - mh) : r.bottom + 6;
  menu.style.left = left + "px"; menu.style.top = top + "px";
  (menu.querySelector('[aria-selected="true"]') || menu.firstElementChild).focus();
}
addEventListener("scroll", closeMenu, { passive: true });
addEventListener("resize", closeMenu);

/* ---------- task card sheet ---------- */
let tsId = "";
function openTask(id) {
  const it = S.items.get(id); if (!it) return; tsId = id;
  $("#ts-in").innerHTML = `<div data-col="items" data-id="${esc(id)}"><div class="grab"></div>
    <textarea rows="1" class="t" data-f="text" aria-label="Задача" placeholder="Задача">${esc(it.text)}</textarea>
    <textarea rows="3" class="n" data-f="note" aria-label="Описание" placeholder="Описание: что именно сделать, детали, контакты">${esc(it.note)}</textarea>
    <input type="text" data-f="due" value="${esc(it.due || "")}" placeholder="Срок, например до 20.12" aria-label="Срок" autocomplete="off">
    <div id="ts-ctl"></div>
    <div class="row"><button type="button" class="ghost" data-act="ts-del">Удалить</button><button type="button" class="btn" data-act="ts-close">Готово</button></div></div>`;
  drawTaskCtl(); $("#ts").hidden = false;
  $("#ts-in").querySelectorAll("textarea").forEach(autosize);
}
function drawTaskCtl() {
  const it = S.items.get(tsId); if (!it) { closeTask(); return; }
  const s = Math.min(it.st | 0, 2), w = it.who || "";
  $("#ts-ctl").innerHTML = `<p class="lbl">Статус</p><div class="chips" style="flex-wrap:wrap">${TSTATUS.map((l, i) =>
      `<button type="button" class="chip" data-act="set" data-f="st" data-v="${i}" aria-pressed="${i === s}">${l}</button>`).join("")}</div>
    <p class="lbl">Ответственный</p><div class="chips" style="flex-wrap:wrap">${[...team(), "Все", ""].map(p =>
      `<button type="button" class="chip" data-act="set" data-f="who" data-v="${esc(p)}" aria-pressed="${p === w}">${p ? esc(p) : "Нет"}</button>`).join("")}</div>`;
}
function closeTask() { const a = document.activeElement; if (a && a.closest && a.closest("#ts")) a.blur(); $("#ts").hidden = true; tsId = ""; }
$("#ts").addEventListener("click", e => { if (e.target.id === "ts") closeTask(); });

/* ---------- note editor with photos ---------- */
let noteId = "";
const IMK = () => KEYM + "im";
const IMG = {}; let imgFetch = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function imgGet(id) {
  if (IMG[id]) return IMG[id];
  if (!imgFetch) imgFetch = rpc("el_get", { k: IMK() }).then(r => { Object.assign(IMG, (r && r.imgs) || {}); }).catch(() => {}).finally(() => { imgFetch = null; });
  await imgFetch; return IMG[id];
}
async function imgStore(id, data) {
  for (let i = 0; i < 4; i++) {
    try {
      const cur = (await rpc("el_get", { k: IMK() })) || {};
      const imgs = { ...(cur.imgs || {}) };
      if (data) imgs[id] = data; else delete imgs[id];
      await rpc("el_put", { p_k: IMK(), p_d: { imgs } });
      const chk = await rpc("el_get", { k: IMK() });
      if (!!(chk && chk.imgs && chk.imgs[id]) === !!data) { if (data) IMG[id] = data; return true; }
    } catch (e) {}
    await sleep(700 + i * 600);
  }
  return false;
}
async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}
let uploading = 0;
async function addPhotos(nid, files) {
  for (const f of files) {
    if (!/^image\//.test(f.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) continue;
    uploading++; drawNoteImgs();
    try {
      const [th, full] = await Promise.all([shrink(f, 320, .62), shrink(f, 1400, .74)]);
      const id = newId("p");
      const ok = await imgStore(id, full);
      if (!ok) { toast("Фото не загрузилось, проверь интернет"); continue; }
      const it = S.items.get(nid); if (!it) continue;
      api.update("items", nid, { imgs: [...(it.imgs || []), { id, th }] });
    } catch (e) { toast("Это фото не получилось прочитать"); }
    finally { uploading--; drawNoteImgs(); }
  }
}
function newNote(sid) {
  const id = newId("n");
  api.set("items", id, { sec: sid, text: "", body: "", imgs: [], ord: Date.now() });
  openNote(id, true);
}
function openNote(id, fresh) {
  const it = S.items.get(id); if (!it) return; noteId = id;
  $("#nedit").innerHTML = `<div class="ne-top"><button class="ne-back" data-act="note-close">${ic("back")}${S.sections.get(it.sec)?.kind === "concept" ? "Концепция" : "Банк идей"}</button><span class="sp"></span>
      ${S.sections.get(it.sec)?.kind === "concept" ? `<button class="appr-btn ${(it.st | 0) === 1 ? "on" : ""}" data-act="approve">${(it.st | 0) === 1 ? "Утверждена" : "Утвердить"}</button>` : ""}
      <label class="ne-ic" aria-label="Добавить фото">${ic("photo")}<input type="file" accept="image/*" multiple data-photos></label>
      <button class="ne-ic" data-act="note-del" aria-label="Удалить заметку">${ic("trash")}</button>
      <button class="ne-done" data-act="note-close">Готово</button></div>
    <div class="ne-body" data-col="items" data-id="${esc(id)}">
      <p class="ne-date">${new Date(it.u || Date.now()).toLocaleString("ru-RU", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" })}</p>
      <textarea rows="1" class="ne-title" data-f="text" placeholder="Заголовок" aria-label="Заголовок">${esc(it.text)}</textarea>
      <textarea rows="4" class="ne-text" data-f="body" placeholder="Пиши идею, ссылки, детали…" aria-label="Текст заметки">${esc(it.body || "")}</textarea>
      <div class="ne-imgs" id="ne-imgs"></div>
    </div>`;
  $("#nedit").hidden = false; document.body.style.overflow = "hidden";
  drawNoteImgs();
  $("#nedit").querySelectorAll("textarea").forEach(autosize);
  if (fresh) setTimeout(() => $(".ne-title").focus(), 60);
}
function drawNoteImgs() {
  const box = $("#ne-imgs"); if (!box || !noteId) return;
  const it = S.items.get(noteId); if (!it) return;
  box.innerHTML = (it.imgs || []).map(p => `<figure data-pid="${esc(p.id)}"><img src="${esc(IMG[p.id] || p.th)}" alt="" data-act="zoom" data-pid="${esc(p.id)}"><button class="rm" data-act="rmph" data-pid="${esc(p.id)}" aria-label="Убрать фото">×</button></figure>`).join("")
    + Array.from({ length: uploading }, () => `<figure class="up">Загружаю…</figure>`).join("")
    + `<label class="ne-addph">${ic("photo")}Добавить фото<input type="file" accept="image/*" multiple data-photos></label>`;
  (it.imgs || []).forEach(p => { if (!IMG[p.id]) imgGet(p.id).then(d => { const im = box.querySelector(`figure[data-pid="${CSS.escape(p.id)}"] img`); if (d && im) im.src = d; }); });
}
function closeNote() {
  const id = noteId; if (!id) return;
  const a = document.activeElement; if (a && a.closest && a.closest("#nedit")) a.blur();
  $("#nedit").hidden = true; $("#nedit").innerHTML = ""; noteId = ""; document.body.style.overflow = "";
  setTimeout(() => { const it = S.items.get(id); if (it && !String(it.text).trim() && !String(it.body || "").trim() && !(it.imgs || []).length && !uploading) api.del("items", id); }, 700);
}
document.addEventListener("change", e => {
  const el = e.target; if (!el.matches || !el.matches("[data-photos]") || !noteId) return;
  const files = [...(el.files || [])]; el.value = ""; if (files.length) addPhotos(noteId, files);
});
$("#lb").addEventListener("click", () => { $("#lb").hidden = true; $("#lb img").src = ""; });

/* ---------- quick add sheet ---------- */
let qaSec = "", qaSt = 0;
function openSheet(pref, st) {
  const r = route(); const list = realSecs(); qaSt = st | 0;
  if (r === "concept") { newConcept(); return; }
  if (!list.length) { location.hash = href("team"); return; }
  const here = r.startsWith("h:") ? curSec(r.slice(2)) : r;
  qaSec = S.sections.has(pref) ? pref : S.sections.has(here) ? here : (list[0] || [])[0];
  if (!pref && S.sections.get(qaSec)?.kind === "notes") { newNote(qaSec); return; }
  drawSheet(); $("#sheet").hidden = false; setTimeout(() => $("#qa-text").focus(), 50);
}
function drawSheet() {
  $("#qa-secs").innerHTML = realSecs().map(([id, s]) => `<button type="button" class="chip" data-act="qa-sec" data-sec="${esc(id)}" aria-pressed="${id === qaSec}">${esc(label(s))}</button>`).join("");
}
const closeSheet = () => { $("#sheet").hidden = true; $("#qa-text").value = ""; qaSt = 0; };
$("#qa").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("#qa-text").value.trim(); if (!text) { $("#qa-text").focus(); return; }
  if (addTo(qaSec, text, qaSt)) { closeSheet(); toast("Добавлено в «" + label(S.sections.get(qaSec)) + "»"); }
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

document.addEventListener("click", e => {
  const mb = e.target.closest("[data-menu]");
  if (mb) { const same = menuCtx && !menu.hidden && mb.classList.contains("open-m"); document.querySelectorAll(".open-m").forEach(x => x.classList.remove("open-m")); if (same) { closeMenu(); return; } mb.classList.add("open-m"); openMenu(mb); return; }
  if (!menu.hidden && !e.target.closest("#menu")) closeMenu();
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, t = target(b);
  if (act === "pick") {
    const c = menuCtx; closeMenu(); if (!c) return;
    api.update(c.col, c.id, { [c.f]: c.f === "st" ? +b.dataset.v : b.dataset.v }); return;
  }
  if (act === "set") { api.update("items", t.id, { [b.dataset.f]: b.dataset.f === "st" ? +b.dataset.v : b.dataset.v }); return; }
  if (act === "task") { openTask(b.dataset.tid); return; }
  if (act === "ts-close") { closeTask(); return; }
  if (act === "ts-del") { confirmClick(b, "Точно удалить?", () => { const id = tsId; closeTask(); api.del("items", id); }); return; }
  if (act === "nskind") { nsKind = b.dataset.k; b.parentElement.querySelectorAll(".chip").forEach(c => { const on = c === b; c.setAttribute("aria-pressed", on); c.setAttribute("aria-checked", on); }); return; }
  if (act === "who") { S.who = b.dataset.who; render(); return; }
  if (act === "newnote") { newNote(b.dataset.sec); return; }
  if (act === "newconcept") { newConcept(); return; }
  if (act === "approve") {
    const it = S.items.get(noteId); if (!it) return; const on = (it.st | 0) !== 1;
    if (on) secItems(it.sec).forEach(([id, x]) => { if ((x.st | 0) === 1) api.update("items", id, { st: 0 }); });
    api.update("items", noteId, { st: on ? 1 : 0 });
    const bt = b; bt.classList.toggle("on", on); bt.textContent = on ? "Утверждена" : "Утвердить"; toast(on ? "Концепция утверждена" : "Утверждение снято"); return; }
  if (act === "note") { openNote(b.dataset.nid); return; }
  if (act === "note-close") { closeNote(); return; }
  if (act === "note-del") { confirmClick(b, "?", () => { const id = noteId; const ph = ((S.items.get(id) || {}).imgs || []).map(p => p.id); noteId = ""; $("#nedit").hidden = true; document.body.style.overflow = ""; api.del("items", id); (async () => { for (const pid of ph) await imgStore(pid, null); })(); }); return; }
  if (act === "zoom") { const pid = b.dataset.pid; const lb = $("#lb"); lb.querySelector("img").src = IMG[pid] || b.src; lb.hidden = false; imgGet(pid).then(d => { if (d && !lb.hidden) lb.querySelector("img").src = d; }); return; }
  if (act === "rmph") { const pid = b.dataset.pid; confirmClick(b, "?", () => { const it = S.items.get(noteId); if (!it) return; api.update("items", noteId, { imgs: (it.imgs || []).filter(p => p.id !== pid) }); imgStore(pid, null); }); return; }
  if (act === "filt") { S.f = b.dataset.k; render(); return; }
  if (act === "tab") { S.tab[b.dataset.hub] = b.dataset.sec; S.f = "all"; S.who = "all"; render(); return; }
  if (act === "coladd") { colAdd = { sid: b.dataset.sec, s: +b.dataset.s }; render(); const i = document.querySelector(".cform input"); if (i) i.focus(); return; }
  if (act === "coladd-ok") { const i = b.closest(".cform").querySelector("input"); addItem(i.dataset.add, i); setTimeout(() => { const j = document.querySelector(".cform input"); if (j) j.focus(); }, 0); return; }
  if (act === "coladd-x") { colAdd = null; render(); return; }
  if (act === "sheet") { openSheet(b.dataset.sec); return; }
  if (act === "sheet-close") { closeSheet(); return; }
  if (act === "qa-sec") { qaSec = b.dataset.sec; drawSheet(); $("#qa-text").focus(); return; }
  if (act === "done") api.update("items", t.id, { done: !(S.items.get(t.id) || {}).done });
  if (act === "st") { const it = S.items.get(t.id) || {}; const n = S.sections.get(it.sec)?.kind === "tasks" ? 3 : 4; api.update("items", t.id, { st: ((it.st | 0) + 1) % n }); }
  if (act === "del") confirmClick(b, "?", () => api.del("items", t.id));
  if (act === "add") { const sec = b.closest("section"); addItem(sec.dataset.id, sec.querySelector("[data-add]")); }
  if (act === "delsec") {
    const sid = t.id;
    confirmClick(b, "?", () => {
      [...S.items.entries()].filter(([, it]) => it.sec === sid).forEach(([id]) => api.del("items", id));
      api.del("sections", sid);
    });
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && colAdd) { colAdd = null; render(); return; }
  if (e.key === "Escape" && !$("#lb").hidden) { $("#lb").hidden = true; return; }
  if (e.key === "Escape" && noteId) { closeNote(); return; }
  if (e.key === "Escape") { if (!menu.hidden) closeMenu(); else if (!$("#ts").hidden) closeTask(); else if (!$("#sheet").hidden) closeSheet(); }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.add) { e.preventDefault(); addItem(e.target.dataset.add, e.target); }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ne-title")) { e.preventDefault(); $(".ne-text").focus(); return; }
  if (e.key === "Enter" && e.target.tagName === "TEXTAREA" && !e.shiftKey && !e.target.closest("#nedit") && !e.target.closest("#ts")) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "newsec") return;
  e.preventDefault();
  const title = $("#ns-title").value.trim(); if (!title) { $("#ns-title").focus(); return; }
  const hub = nsKind; const kind = hub === "fun" ? "ideas" : hub === "ideas" ? "notes" : hub; const sid = newId("s");
  $("#ns-title").value = "";
  api.set("sections", sid, { title, kind, hub, ord: Date.now(), hint: "" });
  location.hash = href(sid);
});

/* ---------- start ---------- */
if (!KEYM) {
  $("#screen").innerHTML = '<div class="loading">Открой полную ссылку от Вики, в ней ключ доступа</div>';
  document.querySelector(".nav").hidden = true;
} else {
  api = syncApi;
  if (Object.keys(D.sections).length) applyToS(); else render();
  sync(); loadPhoto();
  setInterval(() => { if (!document.hidden && !pushTimer) sync(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  addEventListener("hashchange", () => {
    if (!/k=/.test(location.hash)) { history.replaceState(null, "", href(route())); }
    S.who = "all"; S.f = "all"; colAdd = null; nq = ""; if (noteId) closeNote(); closeSheet(); closeTask(); closeMenu(); render(); scrollTo(0, 0);
  });
}
const resizeAll = () => document.querySelectorAll("#screen textarea").forEach(autosize);
if (document.fonts) document.fonts.ready.then(resizeAll);
addEventListener("resize", resizeAll);
setInterval(() => { if (api && !route()) render(); }, 3600 * 1000);
})();
</script>
